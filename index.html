<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #f5f0eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    padding: 24px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 10%, rgba(160,120,90,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 60% at 80% 90%, rgba(130,100,80,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 2px 40px rgba(100,70,50,0.13), 0 1px 4px rgba(100,70,50,0.08);
    animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-header {
    background: linear-gradient(160deg, #3d2b1f 0%, #6b4535 100%);
    padding: 36px 28px 44px;
    text-align: center;
    position: relative;
  }
  .card-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28px;
    background: #fff;
    border-radius: 28px 28px 0 0;
  }
  .photo-wrap {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,0.35);
    position: relative;
    z-index: 1;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.3px;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }
  .tagline {
    font-size: 11.5px;
    font-weight: 300;
    color: rgba(255,215,185,0.88);
    letter-spacing: 0.2px;
    line-height: 1.55;
    max-width: 230px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .card-body {
    padding: 20px 24px 6px;
  }
  .info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .info-row:last-child { border-bottom: none; }
  .info-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #fdf6f0;
    border: 1px solid rgba(150,100,70,0.15);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .info-icon svg { width: 16px; height: 16px; }
  .info-label {
    font-size: 10px;
    color: #b08060;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .info-value {
    font-size: 13px;
    color: #3d2b1f;
    font-weight: 400;
  }
  .card-actions {
    padding: 16px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    border: none;
    transition: transform 0.12s ease, filter 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(0.97); }
  .btn-whatsapp { background: #1da851; color: #fff; }
  .btn-whatsapp:hover { filter: brightness(1.07); }
  .btn-save {
    background: #fdf6f0;
    color: #5c3d2e;
    border: 1.5px solid rgba(150,100,70,0.25);
  }
  .btn-save:hover { background: #f5ece3; }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.25);
    transform: scale(0);
    animation: ripple 0.6s linear;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(3.5); opacity: 0; } }
  .card-footer {
    padding: 12px 24px 20px;
    text-align: center;
    border-top: 1px solid rgba(0,0,0,0.05);
  }
  .footer-text {
    font-size: 10px;
    color: #c0a090;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #3d2b1f;
    color: #f5e0d0;
    padding: 10px 22px;
    border-radius: 40px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

    r.style.top = (e.clientY - rect.top - 50) + 'px';
    btn.appendChild(r);

  }
